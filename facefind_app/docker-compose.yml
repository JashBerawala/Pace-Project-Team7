version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: facefind-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: facefind-backend
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/facefind
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  ml-service:
    build: ./ml-service
    container_name: facefind-ml
    ports:
      - "8000:8000"
    volumes:
      - ml-models:/root/.insightface

  frontend:
    build: ./frontend
    container_name: facefind-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - REACT_APP_SOCKET_URL=http://localhost:5001
    depends_on:
      - backend

volumes:
  mongo-data:
  ml-models:
